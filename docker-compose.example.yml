# Example: copy to docker-compose.yml (git-ignored) and adjust the device path and broker.
# The FHZ shows up as /dev/serial/by-id/usb-ELV_AG_ELV_FHZ_1300_PC_<serial>-if00-port0.
services:
  fhz:
    build: .
    restart: unless-stopped
    network_mode: host
    # /dev from the host plus a cgroup rule for USB serial (major 188, ttyUSB*) instead of
    # `devices:`, so the FHZ can be unplugged and replugged without restarting the container.
    # The simpler `devices: [<by-id path>:/dev/ttyUSB0]` works too, but only until a replug.
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - 'c 188:* rmw'
    group_add:
      - dialout # or the numeric gid of the tty device on the host
    environment:
      FHZ2MQTT_MQTT_URL: mqtt://localhost
      FHZ2MQTT_NAME: fhz
      FHZ2MQTT_SERIALPORT: /dev/serial/by-id/usb-ELV_AG_ELV_FHZ_1300_PC_XXXXXXXX-if00-port0
      TZ: Europe/Berlin # local time: the FHZ clock and FHT sync-time are set from it
      # FHZ2MQTT_ONLY: 1a2b,3c4d
      # FHZ2MQTT_FHT_CODE: 4f # writes a new central code: every FHT must pair again
